syntax = "proto3";

package order;

import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_ASSIGNED = 2;
  ORDER_STATUS_PROCESSING = 3;
  ORDER_STATUS_COMPLETED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_CUSTOMER = 1;
  ACTOR_TYPE_AGENT = 2;
  ACTOR_TYPE_SYSTEM = 3;
}

message OrderItemInput {
  string item_id = 1;
  string name = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message OrderItem {
  string item_id = 1;
  string name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double subtotal = 5;
}

message OrderActivity {
  string id = 1;
  string order_id = 2;
  string action = 3;
  string actor_id = 4;
  ActorType actor_type = 5;
  string from_status = 6;
  string to_status = 7;
  string notes = 8;
  google.protobuf.Timestamp timestamp = 9;
}

message Order {
  string id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  string shipping_address = 5;
  OrderStatus status = 6;
  string assigned_agent_id = 7;
  string assigned_agent_name = 8;
  double total_amount = 9;
  string notes = 10;
  repeated OrderItem items = 11;
  repeated OrderActivity activities = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// 1. Create Order
message CreateOrderRequest {
  string customer_id = 1;
  string customer_name = 2;
  string customer_email = 3;
  string shipping_address = 4;
  repeated OrderItemInput items = 5;
  string notes = 6;
}

message CreateOrderResponse {
  Order order = 1;
  string message = 2;
}

// 2. Get Order
message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

// 3. List Orders
message ListOrdersRequest {
  OrderStatus status_filter = 1;
  string customer_id_filter = 2;
  string agent_id_filter = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 total_pages = 4;
}

// 4. Update Order Details
message UpdateOrderDetailsRequest {
  string order_id = 1;
  string actor_id = 2;
  ActorType actor_type = 3;
  string shipping_address = 4;
  string notes = 5;
  repeated OrderItemInput items = 6;
}

message UpdateOrderDetailsResponse {
  Order order = 1;
  string message = 2;
}

// 5. Assign Order
message AssignOrderRequest {
  string order_id = 1;
  string agent_id = 2;
  string agent_name = 3;
  string actor_id = 4;
  string notes = 5;
}

message AssignOrderResponse {
  Order order = 1;
  string message = 2;
}

// 6. Start Order Processing
message StartOrderProcessingRequest {
  string order_id = 1;
  string agent_id = 2;
  string notes = 3;
}

message StartOrderProcessingResponse {
  Order order = 1;
  string message = 2;
}

// 7. Update Order Status
message UpdateOrderStatusRequest {
  string order_id = 1;
  OrderStatus new_status = 2;
  string actor_id = 3;
  ActorType actor_type = 4;
  string notes = 5;
}

message UpdateOrderStatusResponse {
  Order order = 1;
  string message = 2;
}

// 8. Add Order Activity
message AddOrderActivityRequest {
  string order_id = 1;
  string action = 2;
  string actor_id = 3;
  ActorType actor_type = 4;
  string notes = 5;
}

message AddOrderActivityResponse {
  OrderActivity activity = 1;
  Order order = 2;
  string message = 3;
}

// 9. Cancel Order
message CancelOrderRequest {
  string order_id = 1;
  string actor_id = 2;
  ActorType actor_type = 3;
  string reason = 4;
}

message CancelOrderResponse {
  Order order = 1;
  string message = 2;
}

// 10. Complete Order
message CompleteOrderRequest {
  string order_id = 1;
  string agent_id = 2;
  string notes = 3;
}

message CompleteOrderResponse {
  Order order = 1;
  string message = 2;
}

// Get Order Activities
message GetOrderActivitiesRequest {
  string order_id = 1;
}

message GetOrderActivitiesResponse {
  repeated OrderActivity activities = 1;
}

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrderDetails (UpdateOrderDetailsRequest) returns (UpdateOrderDetailsResponse);
  rpc AssignOrder (AssignOrderRequest) returns (AssignOrderResponse);
  rpc StartOrderProcessing (StartOrderProcessingRequest) returns (StartOrderProcessingResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc AddOrderActivity (AddOrderActivityRequest) returns (AddOrderActivityResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
  rpc CompleteOrder (CompleteOrderRequest) returns (CompleteOrderResponse);
  rpc GetOrderActivities (GetOrderActivitiesRequest) returns (GetOrderActivitiesResponse);
}


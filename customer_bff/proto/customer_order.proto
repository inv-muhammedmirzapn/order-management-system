syntax = "proto3";

package customer_order;

import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_ASSIGNED = 2;
  ORDER_STATUS_PROCESSING = 3;
  ORDER_STATUS_COMPLETED = 4;
  ORDER_STATUS_CANCELLED = 5;
}

enum ActorType {
  ACTOR_TYPE_UNSPECIFIED = 0;
  ACTOR_TYPE_CUSTOMER = 1;
  ACTOR_TYPE_AGENT = 2;
  ACTOR_TYPE_SYSTEM = 3;
}

message OrderItemInput {
  string item_id = 1;
  string name = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message OrderItem {
  string item_id = 1;
  string name = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double subtotal = 5;
}

message OrderActivity {
  string id = 1;
  string order_id = 2;
  string action = 3;
  string actor_id = 4;
  ActorType actor_type = 5;
  string from_status = 6;
  string to_status = 7;
  string notes = 8;
  google.protobuf.Timestamp timestamp = 9;
}

message Order {
  string id = 1;
  string customer_id = 2;
  string customer_name = 3;
  string customer_email = 4;
  string shipping_address = 5;
  OrderStatus status = 6;
  string assigned_agent_id = 7;
  string assigned_agent_name = 8;
  double total_amount = 9;
  string notes = 10;
  repeated OrderItem items = 11;
  repeated OrderActivity activities = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// 1. Create Order
message CreateOrderRequest {
  string customer_id = 1;
  string customer_name = 2;
  string customer_email = 3;
  string shipping_address = 4;
  repeated OrderItemInput items = 5;
  string notes = 6;
}

message CreateOrderResponse {
  Order order = 1;
  string message = 2;
}

// 2. Get Order
message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

// 3. Cancel Order
message CancelOrderRequest {
  string order_id = 1;
  string actor_id = 2;
  ActorType actor_type = 3;
  string reason = 4;
}

message CancelOrderResponse {
  Order order = 1;
  string message = 2;
}

// 4. Update Order Details
message UpdateOrderDetailsRequest {
  string order_id = 1;
  string actor_id = 2;
  ActorType actor_type = 3;
  string shipping_address = 4;
  string notes = 5;
  repeated OrderItemInput items = 6;
}

message UpdateOrderDetailsResponse {
  Order order = 1;
  string message = 2;
}

// 5. Sync Order Status (called by AgentOrderService when agent updates status)
message SyncOrderStatusRequest {
  string order_id = 1;
  OrderStatus new_status = 2;
  string assigned_agent_id = 3;
  string assigned_agent_name = 4;
  string notes = 5;
}

message SyncOrderStatusResponse {
  Order order = 1;
  string message = 2;
}

service CustomerOrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
  rpc UpdateOrderDetails (UpdateOrderDetailsRequest) returns (UpdateOrderDetailsResponse);
  rpc SyncOrderStatus (SyncOrderStatusRequest) returns (SyncOrderStatusResponse);
}
